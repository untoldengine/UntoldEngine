repos:
  - repo: local
    hooks:
      - id: run-exporter-tests
        name: Run Exporter Tests Before Commit
        entry: |
          bash -c '
            if ! make testexporter; then
              echo ""
              echo "Exporter tests failed during pre-commit."
              echo "Run them manually with: make testexporter"
              echo "Or bypass tests with: git commit --no-verify"
              echo ""
              exit 1
            fi
          '
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: run-engine-tests
        name: Run Engine Tests Before Commit
        entry: |
          bash -c '
            if ! make testcore; then
              echo ""
              echo "❌ Engine tests failed during pre-commit."
              echo "🧪 Run them manually with: make testcore"
              echo "👉 Or bypass tests with: git commit --no-verify"
              echo ""
              exit 1
            fi
          '
        language: system
        pass_filenames: false
        stages: [pre-commit]
      
      - id: run-renderer-tests
        name: Running Renderer Visual Tests Before Commit
        entry: |
          bash -c '
            if ! make testrenderer-smoke; then
              echo ""
              echo "❌ Renderer visual tests failed during pre-commit."
              echo "🧪 Run the full renderer suite manually with: make testrenderer"
              echo "👉 Or bypass tests with: git commit --no-verify"
              echo ""
              exit 1
            fi
          '
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: enforce-commit-prefix
        name: Enforcing Commit Message Prefix
        entry: scripts/enforce-commit-prefix.sh
        language: system
        pass_filenames: false
        stages: [commit-msg]

      # LINT-ONLY: fail if formatting is off
      - id: swiftformat-lint
        name: SwiftFormat (lint only)
        entry: swiftformat
        language: system
        types: [swift]
        pass_filenames: true
        args: ["--lint", "--swiftversion", "5.8", "--quiet"]
        stages: [pre-commit]
    
