repos:
  - repo: local
    hooks:
      - id: run-engine-tests 
        name: Running Engine Tests Before Commit 
        entry: bash 
        language: system 
        args: ["-c", "make testcore"] 
        pass_filenames: false
        stages: [pre-commit]

      - id: enforce-commit-prefix
        name: Enforcing Commit Message Prefix
        entry: scripts/enforce-commit-prefix.sh
        language: system
        pass_filenames: false
        stages: [commit-msg]

