site_name: Untold Engine
site_url: https://untoldengine.github.io/UntoldEngine/
repo_url: https://github.com/untoldengine/UntoldEngine
repo_name: untoldengine/UntoldEngine

docs_dir: docs

theme:
  name: material
  logo: images/untoldenginewhite.png
  favicon: images/untoldenginewhite.png
  palette:
    - scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables

nav:
